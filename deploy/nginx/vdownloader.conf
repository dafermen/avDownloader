# Install inside nginx's http context, commonly as
# /etc/nginx/sites-available/vdownloader with a sites-enabled symlink.
limit_req_zone $binary_remote_addr zone=vdownloader_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vdownloader.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vdownloader.example.com;

    ssl_certificate /etc/letsencrypt/live/vdownloader.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vdownloader.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2g;
    client_body_timeout 1h;

    location / {
        limit_req zone=vdownloader_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:5177;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_set_header Host $host;
        # Overwrite, rather than append, client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
