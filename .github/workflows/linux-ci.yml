name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js 20 · Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FFMPEG_PATH: ffmpeg
      YT_DLP_PATH: yt-dlp
      YOUTUBE_DL_SKIP_DOWNLOAD: "true"
      YOUTUBE_DL_SKIP_PYTHON_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system multimedia tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg python3-venv
          python3 -m venv .tools
          .tools/bin/pip install --upgrade yt-dlp
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"

      - name: Install Node.js dependencies
        run: npm ci --omit=optional

      - name: Display versions
        run: |
          node --version
          ffmpeg -version | head -n 1
          yt-dlp --version

      - name: Run deployment quality gate
        run: npm run verify:deploy

      - name: Test health endpoint with system tools
        run: |
          npm start > /tmp/vdownloader.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:5177/api/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5177/api/health | grep '"status":"ok"'
